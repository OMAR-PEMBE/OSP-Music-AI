services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: osp_music
      POSTGRES_USER: osp
      POSTGRES_PASSWORD: osp_dev_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U osp -d osp_music"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: docker.io/pgsty/silo:RELEASE.2026-10-18T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: osp-local
      MINIO_ROOT_PASSWORD: osp-local-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "silo", "healthcheck", "ready"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    env_file: [.env]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://osp:osp_dev_password@db:5432/osp_music
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    volumes:
      - media:/app/media
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build: ./backend
    command: celery -A config worker -l info
    env_file: [.env]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://osp:osp_dev_password@db:5432/osp_music
      REDIS_URL: redis://redis:6379/0
    depends_on:
      api: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3

  beat:
    build: ./backend
    command: celery -A config beat -l info
    env_file: [.env]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://osp:osp_dev_password@db:5432/osp_music
      REDIS_URL: redis://redis:6379/0
    depends_on:
      api: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; assert any('celery' in p.read_text(errors='ignore') and 'beat' in p.read_text(errors='ignore') for p in Path('/proc').glob('[0-9]*/cmdline'))"]
      interval: 30s
      timeout: 10s
      retries: 3

  web:
    build: ./web
    environment:
      NODE_ENV: development
      DJANGO_API_URL: http://api:8000
    ports: ["3000:3000"]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  miniodata:
  media:
